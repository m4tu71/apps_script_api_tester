<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ランキング</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: #fff;
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 32px auto;
    }

    .hero {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.75rem;
    }

    .lead,
    .summary,
    .status,
    .api-note {
      color: #666;
    }

    .lead {
      margin: 0;
    }

    .panel {
      padding: 0;
    }

    .connection {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      grid-column: 1 / -1;
      font-weight: 600;
    }

    input,
    button {
      min-height: 40px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font: inherit;
    }

    input {
      width: 100%;
      padding: 8px 10px;
    }

    button {
      padding: 8px 14px;
      color: #222;
      background: #f5f5f5;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #e8e8e8;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #555;
      outline-offset: 2px;
    }

    button:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .status {
      min-height: 1.6em;
      margin: 0 0 12px;
    }

    .status.good {
      color: #176b2c;
    }

    .status.bad {
      color: #a31515;
    }

    .table-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .summary {
      margin: 0;
      font-size: 0.92rem;
    }

    .table-wrap {
      overflow-x: auto;
      border-top: 1px solid #bbb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 8px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .rank {
      width: 72px;
      font-weight: 600;
    }

    .rank.top-three {
      font-weight: 700;
    }

    .score {
      font-variant-numeric: tabular-nums;
    }

    .empty {
      padding: 24px;
      color: #666;
      text-align: center;
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }

    .pagination button {
      min-width: 40px;
      padding: 6px 10px;
      background: #fff;
    }

    .pagination button[aria-current="page"] {
      color: #fff;
      background: #333;
    }

    .api-note {
      margin: 16px 0 0;
      font-size: 0.86rem;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (max-width: 620px) {
      main {
        margin-top: 20px;
      }

      .connection {
        grid-template-columns: 1fr;
      }

      .table-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      th,
      td {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <h1>ランキング</h1>
      <p class="lead">上位から10件ずつ表示します。</p>
    </header>

    <section class="panel" aria-labelledby="rankingTitle">
      <form id="rankingForm" class="connection">
        <label for="apiUrl">ランキングAPI URL</label>
        <input
          id="apiUrl"
          type="url"
          placeholder="https://script.google.com/macros/s/.../exec"
          autocomplete="url"
          required
        />
        <button id="loadButton" type="submit">ランキングを表示</button>
      </form>

      <p id="status" class="status" aria-live="polite">API URLを入力してください。</p>

      <div class="table-heading">
        <h2 id="rankingTitle">TOP 10</h2>
        <p id="summary" class="summary"></p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">順位</th>
              <th scope="col">名前</th>
              <th scope="col">スコア</th>
              <th scope="col">タイム（分）</th>
            </tr>
          </thead>
          <tbody id="rankingBody">
            <tr><td class="empty" colspan="4">まだ取得していません。</td></tr>
          </tbody>
        </table>
      </div>

      <nav id="pagination" class="pagination" aria-label="ランキングのページ" hidden></nav>

      <p class="api-note">
        10位より下も表示するには、APIがランキング全件（または必要な件数）を返す必要があります。
        <code>index.html?api=WebアプリURL</code> の形式で開くと自動で読み込みます。
      </p>
    </section>
  </main>

  <script>
    const PAGE_SIZE = 10;
    const apiUrl = document.getElementById("apiUrl");
    const form = document.getElementById("rankingForm");
    const loadButton = document.getElementById("loadButton");
    const status = document.getElementById("status");
    const title = document.getElementById("rankingTitle");
    const summary = document.getElementById("summary");
    const rankingBody = document.getElementById("rankingBody");
    const pagination = document.getElementById("pagination");

    let rankings = [];
    let currentPage = 1;

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = "status" + (type ? " " + type : "");
    }

    function formatNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number.toLocaleString("ja-JP") : "-";
    }

    function addCell(row, value, className = "") {
      const cell = document.createElement("td");
      cell.textContent = value;
      if (className) cell.className = className;
      row.appendChild(cell);
      return cell;
    }

    function renderPage(page) {
      const totalPages = Math.max(1, Math.ceil(rankings.length / PAGE_SIZE));
      currentPage = Math.min(Math.max(page, 1), totalPages);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = rankings.slice(start, start + PAGE_SIZE);
      const firstRank = start + 1;
      const lastRank = Math.min(start + PAGE_SIZE, rankings.length);

      title.textContent = currentPage === 1
        ? "TOP 10"
        : `${firstRank}〜${start + PAGE_SIZE}位`;
      summary.textContent = rankings.length
        ? `${firstRank}〜${lastRank}位 / 全${rankings.length}件`
        : "0件";
      rankingBody.replaceChildren();

      if (pageItems.length === 0) {
        const row = document.createElement("tr");
        const cell = addCell(row, "ランキングデータはありません。", "empty");
        cell.colSpan = 4;
        rankingBody.appendChild(row);
      } else {
        pageItems.forEach((item, index) => {
          const row = document.createElement("tr");
          const fallbackRank = start + index + 1;
          const itemRank = Number(item.rank);
          const rank = Number.isFinite(itemRank) ? itemRank : fallbackRank;
          const rankCell = addCell(row, rank + "位", "rank");

          if (rank <= 3) rankCell.classList.add("top-three");
          addCell(row, item.name ?? "");
          addCell(row, formatNumber(item.score), "score");
          addCell(row, Number.isFinite(Number(item.time)) ? `${item.time} 分` : "-");
          rankingBody.appendChild(row);
        });
      }

      renderPagination(totalPages);
    }

    function makePageButton(label, page, options = {}) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.disabled = options.disabled ?? false;
      button.setAttribute("aria-label", options.ariaLabel ?? label);

      if (options.current) button.setAttribute("aria-current", "page");
      button.addEventListener("click", () => {
        renderPage(page);
        document.querySelector(".table-heading").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      return button;
    }

    function renderPagination(totalPages) {
      pagination.replaceChildren();
      pagination.hidden = totalPages <= 1;
      if (totalPages <= 1) return;

      pagination.appendChild(makePageButton("前へ", currentPage - 1, {
        disabled: currentPage === 1,
        ariaLabel: "前の10件"
      }));

      for (let page = 1; page <= totalPages; page += 1) {
        pagination.appendChild(makePageButton(String(page), page, {
          current: page === currentPage,
          ariaLabel: `${page}ページ目`
        }));
      }

      pagination.appendChild(makePageButton("次へ", currentPage + 1, {
        disabled: currentPage === totalPages,
        ariaLabel: "次の10件"
      }));
    }

    async function loadRanking(url) {
      loadButton.disabled = true;
      setStatus("ランキングを取得中...");

      try {
        const response = await fetch(url);
        const text = await response.text();
        let data;

        try {
          data = JSON.parse(text);
        } catch {
          throw new Error("APIの応答をJSONとして読み取れませんでした。");
        }

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        // 配列形式に加え、将来のページングAPIで使いやすい { rankings: [] } も許可する。
        const items = Array.isArray(data) ? data : data?.rankings;
        if (!Array.isArray(items)) {
          throw new Error("APIの応答にランキング配列がありません。");
        }

        rankings = items;
        renderPage(1);
        setStatus(`${rankings.length}件のランキングを取得しました。`, "good");
      } catch (error) {
        rankings = [];
        renderPage(1);
        setStatus("取得に失敗しました: " + error.message, "bad");
      } finally {
        loadButton.disabled = false;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const url = apiUrl.value.trim();
      if (url) loadRanking(url);
    });

    const queryUrl = new URLSearchParams(window.location.search).get("api");
    if (queryUrl) {
      apiUrl.value = queryUrl;
      loadRanking(queryUrl);
    }
  </script>
</body>
</html>
